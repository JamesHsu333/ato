# 03 Floppy (spec §50). Shooter starts under the rim with a single screen on one
# block and a staggered double on the other. He reads his defender and picks a side.
version: "0.1"

play:
  id: floppy
  name: Floppy
  description: Shooter under the rim chooses the single screen or the stagger double.

actors:
  handler: { character: generic_guard, team: offense, role: ball_handler }
  shooter: { character: generic_wing, team: offense, role: shooter }
  single:  { character: generic_big, team: offense, role: screener }
  double_a: { character: generic_big, team: offense, role: screener }
  double_b: { character: generic_wing, team: offense, role: screener }
  x1: { character: generic_defender, team: defense, assignment: handler }
  x2: { character: generic_defender, team: defense, assignment: shooter }
  x3: { character: generic_big, team: defense, assignment: single }
  x4: { character: generic_big, team: defense, assignment: double_a }
  x5: { character: generic_defender, team: defense, assignment: double_b }

setup:
  handler:  { position: top, possession: ball }
  shooter:  { position: { x: 0, z: 0.9 } }
  single:   { position: { x: -2.9, z: 2.4 } }
  double_a: { position: { x: 2.9, z: 2.0 } }
  double_b: { position: { x: 3.3, z: 3.1 } }
  x1: { relative_to: handler, defensive_position: on_ball }
  x2: { position: { x: 0, z: 1.6 } }
  x3: { relative_to: single, defensive_position: matchup }
  x4: { relative_to: double_a, defensive_position: matchup }
  x5: { relative_to: double_b, defensive_position: matchup }

graph:
  start:
    actions:
      - { actor: single, action: pin_down, for: shooter, to: { x: -2.3, z: 1.9 } }
      - { actor: double_a, action: pin_down, for: shooter, to: { x: 2.3, z: 1.7 } }
      - { actor: double_b, action: pin_down, for: shooter, to: { x: 2.7, z: 2.5 } }
    transitions:
      - when: { all: [single.screen_set, double_a.screen_set, double_b.screen_set] }
        to: read

  # Screen selection: the shooter's route decides the branch.
  read:
    player_options:
      - id: double_side
        label: Run off the double
        action: { actor: shooter, action: cut, to: right_wing, via: double_a.left_shoulder }
      - id: single_side
        label: Run off the single
        action: { actor: shooter, action: cut, to: left_wing, via: single.right_shoulder }
    transitions:
      - when: shooter.cut_done
        to: feed

  feed:
    actions:
      - { actor: handler, action: pass, target: shooter }
    transitions:
      - when: shooter.caught
        to: shoot

  shoot:
    actions:
      - { actor: shooter, action: shoot, type: catch_and_shoot }

simulation:
  seed: 3
